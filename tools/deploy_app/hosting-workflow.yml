# Push each new version of your app to CitiXsys App Hosting (guide 14b, "Updates from your GitHub").
# Copy this file to .github/workflows/ivendnext-hosting.yml in your app's repository. Then, in the repository's
# Settings > Secrets and variables > Actions > Variables, add:
#   IVN_HOSTING_ROLE   the role `deploy_app.py status` prints for your app (arn:aws:iam::…:role/partner-app-<app>-github)
#   IVN_APP_FOLDER     the folder holding app.json (default: the repository's root)
#   IVN_APP_ID         only for a staging or sandbox copy: its address name, <app>-staging or <app>-sandbox
#   IVN_PACKAGE_ROOT   a function only: the folder its app.json "package" paths start from (default IVN_APP_FOLDER;
#                      the repository's root, ".", for an app made with tools/manifest/start.py)
# No secret is needed: GitHub signs this run in to that one role, which can only push your app's new version. The role
# trusts this repository's sign-in subject exactly (the prefix you gave the order with --github-subject, and the branch).
#
# On each push to the branch your order names, it reads the version from app.json and pushes that version: an image
# (a container) or a package (a function). The hosting sees the push and puts that version live through its own
# checks; this workflow cannot change your app any other way. A version is never overwritten: raise app.json's
# "version" for each release. To go back, release the earlier code under a new version number.
name: ivendnext-hosting

on:
  push:
    branches: [main]   # the branch your hosting order names (--branch)

permissions:
  id-token: write      # GitHub's sign-in to AWS
  contents: read

jobs:
  push:
    runs-on: ubuntu-24.04-arm   # ARM64, as the hosting runs
    env:
      FOLDER: ${{ vars.IVN_APP_FOLDER || '.' }}
      APP_ID: ${{ vars.IVN_APP_ID }}
      PACKAGE_ROOT: ${{ vars.IVN_PACKAGE_ROOT || vars.IVN_APP_FOLDER || '.' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read app.json
        id: app
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open(os.path.join(os.environ["FOLDER"], "app.json")))
          print(f"name={os.environ.get('APP_ID') or m['app']}")
          print(f"version={m['version']}")
          print(f"runs={m.get('runs', 'container')}")
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IVN_HOSTING_ROLE }}
          aws-region: us-east-1
      - name: Push the image (a container)
        if: steps.app.outputs.runs == 'container'
        run: |
          REG="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.us-east-1.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REG"
          IMAGE="$REG/partner-apps/${{ steps.app.outputs.name }}:${{ steps.app.outputs.version }}"
          docker build --platform linux/arm64 -t "$IMAGE" "$FOLDER"
          docker push "$IMAGE"
      - name: Push the package (a function)
        if: steps.app.outputs.runs == 'function'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["PACKAGE_ROOT"])
          m = json.load(open(os.path.join(os.environ["FOLDER"], "app.json")))
          skip = re.compile(r"(^|/)(\.[^/]*|__pycache__)(/|$)|\.pyc$")
          files = []
          for part in m.get("package") or []:
              p = root / part
              files += [p] if p.is_file() else sorted(f for f in p.rglob("*") if f.is_file())
          with zipfile.ZipFile("/tmp/package.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for f in sorted(set(files)):
                  name = f.relative_to(root).as_posix()
                  if not skip.search(name):
                      z.write(f, name)
          PY
          BUCKET="ivn-selfserve-code-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api put-object --bucket "$BUCKET" --key "${{ steps.app.outputs.name }}/${{ steps.app.outputs.version }}.zip" \
            --body /tmp/package.zip --if-none-match '*'
