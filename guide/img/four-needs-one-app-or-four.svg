<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" width="900" height="505" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Four needs for one chain: one app, or four?</title><desc id="d">One chain needs four things. As one app: one manifest carrying two till keys, a check at Pay, three record types and a Desk button, served by one service at one address; one version, one consent, one removal; on App Hosting one box at one price, free when it runs as a function and is listed in the App library. As four apps: four manifests and four services; four versions, four consents, removed one by one; on App Hosting four boxes at four prices; on your own server they can share one container. A separate copy for one chain only when you choose it.</desc>
<rect width="900" height="505" rx="16" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="800" fill="#0b1029" text-anchor="start">Four needs for one chain: one app, or four?</text>
<text x="24" y="60" font-size="14" font-weight="500" fill="#59607a" text-anchor="start">Usually one app. Split only what has its own life.</text>
<rect x="16" y="80" width="426" height="325.6" rx="14" fill="#e3f5ea" stroke="#13794a" stroke-width="1.5"/>
<rect x="458" y="80" width="426" height="325.6" rx="14" fill="#f1ebff" stroke="#5b3cc4" stroke-width="1.5"/>
<text x="32" y="112" font-size="17" font-weight="800" fill="#13794a" text-anchor="start">One app</text>
<text x="474" y="112" font-size="17" font-weight="800" fill="#5b3cc4" text-anchor="start">Four apps</text>
<rect x="32" y="130" width="394" height="82.8" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="44" y="156" font-size="15.5" font-weight="800" fill="#0b1029" text-anchor="start">One manifest</text>
<text x="44" y="178" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">2 till keys · 1 check at Pay · 3 record types ·</text>
<text x="44" y="196.8" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">1 Desk button</text>
<rect x="32" y="224.8" width="394" height="64" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="44" y="250.8" font-size="15.5" font-weight="800" fill="#0b1029" text-anchor="start">One service</text>
<text x="44" y="272.8" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">One address, one box</text>
<rect x="474" y="130" width="190" height="82.8" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="486" y="156" font-size="15.5" font-weight="800" fill="#0b1029" text-anchor="start">App 1</text>
<text x="486" y="178" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">own manifest ·</text>
<text x="486" y="196.8" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">own service</text>
<rect x="678" y="130" width="190" height="82.8" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="690" y="156" font-size="15.5" font-weight="800" fill="#0b1029" text-anchor="start">App 2</text>
<text x="690" y="178" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">own manifest ·</text>
<text x="690" y="196.8" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">own service</text>
<rect x="474" y="224.8" width="190" height="82.8" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="486" y="250.8" font-size="15.5" font-weight="800" fill="#0b1029" text-anchor="start">App 3</text>
<text x="486" y="272.8" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">own manifest ·</text>
<text x="486" y="291.6" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">own service</text>
<rect x="678" y="224.8" width="190" height="82.8" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="690" y="250.8" font-size="15.5" font-weight="800" fill="#0b1029" text-anchor="start">App 4</text>
<text x="690" y="272.8" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">own manifest ·</text>
<text x="690" y="291.6" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">own service</text>
<text x="32" y="337.6" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">One version, one consent, one removal</text>
<text x="32" y="361.6" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">On App Hosting: one box, one price</text>
<text x="32" y="385.6" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">Free when it runs as a function and is listed</text>
<text x="474" y="337.6" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">Four versions, four consents, removed one by one</text>
<text x="474" y="361.6" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">On App Hosting: four boxes, four prices</text>
<text x="474" y="385.6" font-size="13.6" font-weight="500" fill="#3b4256" text-anchor="start">On your own server: they can share one container</text>
<rect x="16" y="425.6" width="868" height="63" rx="12" fill="#0b1029"/>
<text x="32" y="451.6" font-size="13.6" font-weight="500" fill="#f2f5fb" text-anchor="start">A separate copy for one chain only when you choose it: its own rules, its own release dates, or a contract that</text>
<text x="32" y="470.6" font-size="13.6" font-weight="500" fill="#f2f5fb" text-anchor="start">asks for it.</text>
</svg>
