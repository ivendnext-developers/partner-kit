<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 664" width="640" height="664" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">How you play</title><desc id="d">Six steps from a sandbox to a retail chain's iVendNext. One: the partner gets a sandbox and the kit. Two: the partner builds with the kit. Three: the partner publishes the app to the customer's private shelf. Four: the app runs on the partner's server or on iVendNext App Hosting. Five: the customer installs it with consent. Six: the partner keeps the customer and bills them. Optionally CitiXsys lists the app for everyone.</desc>
<rect width="640" height="664" rx="16" fill="#0d1120"/>
<text x="24" y="38" font-size="22" font-weight="800" fill="#eef1f8" text-anchor="start">How you play</text>
<text x="24" y="60" font-size="14" font-weight="500" fill="#a3abc0" text-anchor="start">From a sandbox to an app that runs a retail chain, in six steps.</text>
<rect x="16" y="80" width="296" height="158" rx="12" fill="#151a2c" stroke="#2f3752" stroke-width="1.3"/>
<circle cx="44" cy="110" r="15" fill="#4aa6ff"/>
<text x="44" y="116" font-size="16" font-weight="800" fill="#151a2c" text-anchor="middle">1</text>
<text x="68" y="116" font-size="16.5" font-weight="800" fill="#eef1f8" text-anchor="start">Get a sandbox</text>
<rect x="30" y="134" width="66" height="20" rx="10" fill="#16294a"/>
<text x="63.116" y="148" font-size="11" font-weight="800" fill="#4aa6ff" text-anchor="middle" letter-spacing="0.6">PARTNER</text>
<text x="30" y="174.0" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">Sign the partner terms. You get a</text><text x="30" y="192.2" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">sandbox iVendNext and the partner</text><text x="30" y="210.4" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">kit.</text>
<rect x="328" y="80" width="296" height="158" rx="12" fill="#151a2c" stroke="#2f3752" stroke-width="1.3"/>
<circle cx="356" cy="110" r="15" fill="#4aa6ff"/>
<text x="356" y="116" font-size="16" font-weight="800" fill="#151a2c" text-anchor="middle">2</text>
<text x="380" y="116" font-size="16.5" font-weight="800" fill="#eef1f8" text-anchor="start">Build with the kit</text>
<rect x="342" y="134" width="66" height="20" rx="10" fill="#16294a"/>
<text x="375.116" y="148" font-size="11" font-weight="800" fill="#4aa6ff" text-anchor="middle" letter-spacing="0.6">PARTNER</text>
<text x="342" y="174.0" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">Use the highest rung of the ladder</text><text x="342" y="192.2" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">that does the job. The checker tells</text><text x="342" y="210.4" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">you what the customer will be asked</text><text x="342" y="228.6" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">to agree to.</text>
<rect x="16" y="252" width="296" height="158" rx="12" fill="#151a2c" stroke="#2f3752" stroke-width="1.3"/>
<circle cx="44" cy="282" r="15" fill="#4aa6ff"/>
<text x="44" y="288" font-size="16" font-weight="800" fill="#151a2c" text-anchor="middle">3</text>
<text x="68" y="288" font-size="16.5" font-weight="800" fill="#eef1f8" text-anchor="start">Publish to your customer</text>
<rect x="30" y="306" width="66" height="20" rx="10" fill="#16294a"/>
<text x="63.116" y="320" font-size="11" font-weight="800" fill="#4aa6ff" text-anchor="middle" letter-spacing="0.6">PARTNER</text>
<text x="30" y="346.0" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">Your app lands on that customer's</text><text x="30" y="364.2" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">private shelf in the App library.</text><text x="30" y="382.4" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">CitiXsys does not approve it.</text>
<rect x="328" y="252" width="296" height="158" rx="12" fill="#151a2c" stroke="#2f3752" stroke-width="1.3"/>
<circle cx="356" cy="282" r="15" fill="#b9a3ff"/>
<text x="356" y="288" font-size="16" font-weight="800" fill="#151a2c" text-anchor="middle">4</text>
<text x="380" y="288" font-size="16.5" font-weight="800" fill="#eef1f8" text-anchor="start">Run it</text>
<rect x="342" y="306" width="145" height="20" rx="10" fill="#251d45"/>
<text x="414.584" y="320" font-size="11" font-weight="800" fill="#b9a3ff" text-anchor="middle" letter-spacing="0.6">PARTNER · CITIXSYS</text>
<text x="342" y="346.0" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">On your own server, or order</text><text x="342" y="364.2" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">iVendNext App Hosting and we create</text><text x="342" y="382.4" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">its box and address.</text>
<rect x="16" y="424" width="296" height="158" rx="12" fill="#151a2c" stroke="#2f3752" stroke-width="1.3"/>
<circle cx="44" cy="454" r="15" fill="#5fd39a"/>
<text x="44" y="460" font-size="16" font-weight="800" fill="#151a2c" text-anchor="middle">5</text>
<text x="68" y="460" font-size="16.5" font-weight="800" fill="#eef1f8" text-anchor="start">Installs with consent</text>
<rect x="30" y="478" width="73" height="20" rx="10" fill="#12321f"/>
<text x="66.704" y="492" font-size="11" font-weight="800" fill="#5fd39a" text-anchor="middle" letter-spacing="0.6">CUSTOMER</text>
<text x="30" y="518.0" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">They read what the app will do, tick,</text><text x="30" y="536.2" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">install. A new version needs their</text><text x="30" y="554.4" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">consent too.</text>
<rect x="328" y="424" width="296" height="158" rx="12" fill="#151a2c" stroke="#2f3752" stroke-width="1.3"/>
<circle cx="356" cy="454" r="15" fill="#4aa6ff"/>
<text x="356" y="460" font-size="16" font-weight="800" fill="#151a2c" text-anchor="middle">6</text>
<text x="380" y="460" font-size="16.5" font-weight="800" fill="#eef1f8" text-anchor="start">Keep the customer</text>
<rect x="342" y="478" width="66" height="20" rx="10" fill="#16294a"/>
<text x="375.116" y="492" font-size="11" font-weight="800" fill="#4aa6ff" text-anchor="middle" letter-spacing="0.6">PARTNER</text>
<text x="342" y="518.0" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">Your customer, your price, your</text><text x="342" y="536.2" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">invoice. Then build the next app for</text><text x="342" y="554.4" font-size="14" font-weight="500" fill="#c3c9d8" text-anchor="start">the next one.</text>
<rect x="16" y="598" width="608" height="50" rx="12" fill="#151a2c" stroke="#a3abc0" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="32" y="620" font-size="14.5" font-weight="800" fill="#eef1f8" text-anchor="start">Optional: ask CitiXsys to list it for everyone</text>
<text x="32" y="638" font-size="12.8" font-weight="500" fill="#a3abc0" text-anchor="start">One approval per app puts it on the public App library, with its card and its guide page.</text>
</svg>
