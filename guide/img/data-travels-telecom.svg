<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 972" width="820" height="972" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">How the data travels: a phone retailer and a telecom company</title><desc id="d">Example 2, a phone retailer and a telecom company, as a sequence across four parties: the till, the retailer&#x27;s iVendNext, your service (sample S52) and the telecom company. Before any sale, on each pass, your service reads the plans from the telecom company with this retailer&#x27;s own account at GET /v1/plans and writes their prices to the retailer&#x27;s price list as Item Price rows. At the till: the cashier scans the phone and presses Plans; the till sends the sale&#x27;s lines and customer, no price; the retailer&#x27;s iVendNext calls your service at POST /tel/plans, signed with this retailer&#x27;s Plans secret; your service reads the retailer&#x27;s own telecom account from PP TEL Settings with the app&#x27;s key; it asks the telecom company at POST /v1/offers for the plans for this phone and customer; the till shows them in a message and nothing is added. The cashier adds the chosen plan&#x27;s item, priced from the list. At Pay, the retailer&#x27;s iVendNext sends your service the priced basket at POST /tel/check; your service asks the telecom company again whether the plan is still offered to this customer at this price, and answers allow or refuse in plain words. After payment, your service pulls the sale from the event feed, activates the plan at POST /v1/activations with the retailer&#x27;s site, the sale and its line as the Idempotency-Key, and writes the activation number to a PP TEL Activation row listed under the sale.</desc>
<rect width="820" height="972" rx="16" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="800" fill="#0b1029">How the data travels: a phone retailer and a telecom company</text>
<text x="24" y="60" font-size="14" font-weight="500" fill="#59607a">Sample S52. The plan is a line before payment; the telecom company has the last word at Pay.</text>
<path d="M110.0,126 V956" stroke="#b8c1d4" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="18.0" y="80" width="184" height="46" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="110.0" y="106" font-size="13.5" font-weight="800" fill="#0b1029" text-anchor="middle">The till</text>
<path d="M310.0,126 V956" stroke="#b8c1d4" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="218.0" y="80" width="184" height="46" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="310.0" y="99" font-size="13.5" font-weight="800" fill="#0b1029" text-anchor="middle">The retailer&#x27;s</text>
<text x="310.0" y="116" font-size="13.5" font-weight="800" fill="#0b1029" text-anchor="middle">iVendNext</text>
<path d="M510.0,126 V956" stroke="#b8c1d4" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="418.0" y="80" width="184" height="46" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="510.0" y="99" font-size="13.5" font-weight="800" fill="#0b1029" text-anchor="middle">Your service</text>
<text x="510.0" y="116" font-size="13.5" font-weight="800" fill="#0b1029" text-anchor="middle">(sample S52)</text>
<path d="M710.0,126 V956" stroke="#b8c1d4" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="618.0" y="80" width="184" height="46" rx="10" fill="#ffffff" stroke="#cfd6e4" stroke-width="1.3"/>
<text x="710.0" y="99" font-size="13.5" font-weight="800" fill="#0b1029" text-anchor="middle">The telecom</text>
<text x="710.0" y="116" font-size="13.5" font-weight="800" fill="#0b1029" text-anchor="middle">company</text>
<rect x="16" y="148" width="788" height="24" rx="6" fill="#eef2f8"/>
<text x="28" y="164" font-size="11.5" font-weight="800" fill="#0b1029" text-anchor="start">BEFORE ANY SALE, EACH PASS</text>
<path d="M510.0,204 H702.0" stroke="#a15c00" stroke-width="2" fill="none"/><path d="M710.0,204 L701.0,199 L701.0,209 z" fill="#a15c00"/>
<text x="610.0" y="196" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">0  GET /v1/plans</text>
<text x="610.0" y="221" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">this retailer&#x27;s own telecom account</text>
<path d="M510.0,252 H318.0" stroke="#0b6bcb" stroke-width="2" fill="none"/><path d="M310.0,252 L319.0,247 L319.0,257 z" fill="#0b6bcb"/>
<text x="410.0" y="244" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">0  write Item Price on the plans&#x27; price list</text>
<text x="410.0" y="269" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">the plans priced as the telecom company prices them</text>
<rect x="16" y="278" width="788" height="24" rx="6" fill="#eef2f8"/>
<text x="28" y="294" font-size="11.5" font-weight="800" fill="#0b1029" text-anchor="start">AT THE TILL, BEFORE PAYMENT</text>
<path d="M110.0,334 H302.0" stroke="#0b6bcb" stroke-width="2" fill="none"/><path d="M310.0,334 L301.0,329 L301.0,339 z" fill="#0b6bcb"/>
<text x="210.0" y="326" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">1  The cashier scans the phone, presses Plans</text>
<text x="210.0" y="351" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">the sale&#x27;s lines and customer, no price</text>
<path d="M310.0,382 H502.0" stroke="#0b6bcb" stroke-width="2" fill="none"/><path d="M510.0,382 L501.0,377 L501.0,387 z" fill="#0b6bcb"/>
<text x="410.0" y="374" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">2  POST /tel/plans</text>
<text x="410.0" y="399" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">signed with this retailer&#x27;s Plans secret</text>
<path d="M510.0,430 H318.0" stroke="#0b6bcb" stroke-width="2" fill="none"/><path d="M310.0,430 L319.0,425 L319.0,435 z" fill="#0b6bcb"/>
<text x="410.0" y="422" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">3  GET PP TEL Settings/Default</text>
<text x="410.0" y="447" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">the retailer&#x27;s own telecom account, with the app&#x27;s key</text>
<path d="M510.0,478 H702.0" stroke="#a15c00" stroke-width="2" fill="none"/><path d="M710.0,478 L701.0,473 L701.0,483 z" fill="#a15c00"/>
<text x="610.0" y="470" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">4  POST /v1/offers</text>
<text x="610.0" y="495" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">the phone, the customer, this retailer&#x27;s account</text>
<path d="M510.0,526 H118.0" stroke="#0b6bcb" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M110.0,526 L119.0,521 L119.0,531 z" fill="#0b6bcb"/>
<text x="310.0" y="518" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">5  message: the plans and their prices</text>
<text x="310.0" y="543" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">shown on the till; nothing added to the sale</text>
<rect x="24" y="556" width="419.0" height="24" rx="12" fill="#ffffff" stroke="#13794a" stroke-width="1.4"/>
<text x="233.5" y="572" font-size="12" font-weight="700" fill="#13794a" text-anchor="middle">6  The cashier adds the plan&#x27;s item, priced from the list</text>
<rect x="16" y="588" width="788" height="24" rx="6" fill="#eef2f8"/>
<text x="28" y="604" font-size="11.5" font-weight="800" fill="#0b1029" text-anchor="start">AT PAY</text>
<path d="M310.0,644 H502.0" stroke="#0b6bcb" stroke-width="2" fill="none"/><path d="M510.0,644 L501.0,639 L501.0,649 z" fill="#0b6bcb"/>
<text x="410.0" y="636" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">7  POST /tel/check</text>
<text x="410.0" y="661" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">the priced basket, signed with the check&#x27;s secret</text>
<path d="M510.0,692 H702.0" stroke="#a15c00" stroke-width="2" fill="none"/><path d="M710.0,692 L701.0,687 L701.0,697 z" fill="#a15c00"/>
<text x="610.0" y="684" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">8  POST /v1/offers</text>
<text x="610.0" y="709" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">still offered to this customer, at this price?</text>
<path d="M510.0,740 H318.0" stroke="#0b6bcb" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M310.0,740 L319.0,735 L319.0,745 z" fill="#0b6bcb"/>
<text x="410.0" y="732" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">9  allow, or refuse in plain words</text>
<text x="410.0" y="757" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">the payment sheet opens, or the cashier reads why</text>
<rect x="16" y="766" width="788" height="24" rx="6" fill="#eef2f8"/>
<text x="28" y="782" font-size="11.5" font-weight="800" fill="#0b1029" text-anchor="start">AFTER PAYMENT</text>
<path d="M510.0,822 H318.0" stroke="#13794a" stroke-width="2" fill="none"/><path d="M310.0,822 L319.0,817 L319.0,827 z" fill="#13794a"/>
<text x="410.0" y="814" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">10  the event feed: sale booked</text>
<text x="410.0" y="839" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">your service pulls it with the app&#x27;s key</text>
<path d="M510.0,870 H702.0" stroke="#a15c00" stroke-width="2" fill="none"/><path d="M710.0,870 L701.0,865 L701.0,875 z" fill="#a15c00"/>
<text x="610.0" y="862" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">11  POST /v1/activations</text>
<text x="610.0" y="887" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">Idempotency-Key: the retailer&#x27;s site, the sale and its line</text>
<path d="M510.0,918 H318.0" stroke="#13794a" stroke-width="2" fill="none"/><path d="M310.0,918 L319.0,913 L319.0,923 z" fill="#13794a"/>
<text x="410.0" y="910" font-size="12.5" font-weight="700" fill="#0b1029" text-anchor="middle">12  write PP TEL Activation: the number</text>
<text x="410.0" y="935" font-size="11.2" font-weight="500" fill="#59607a" text-anchor="middle">listed under the sale, in its Connections</text>
