<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t d">
<title id="t">The path from a shop's consent to your app's answer</title>
<desc id="d">On the left, the shop's iVendNext; on the right, your app. 1: the administrator consents at install, and the install adds your roles and makes each till key's secret. 2: the administrator makes your app's own user with one narrow role. 3: the shop's site connects to your app with its App library key, its address and its secrets. 4: a cashier's press is signed with the shop's secret. 5: your app checks the signature before it reads the call. 6: it answers within three seconds, or the till says nothing was added. 7: your app calls the shop's API as its own user. 8: at uninstall the site says goodbye and your app forgets the shop.</desc>
<style>
  .bg { fill: #ffffff; } .zone { fill: #eef4fb; stroke: #c9d8ea; stroke-width: 1.5; } .app { fill: #f3f1fb; stroke: #d6cff0; stroke-width: 1.5; }
  .box { fill: #ffffff; stroke: #d5dbe6; stroke-width: 1.2; }
  .h { font: 800 13px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .1em; fill: #0b1029; }
  .n { font: 800 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0079e6; }
  .b { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b1029; }
  .s { font: 500 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a5268; }
  .m { font: 500 11.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #0b1029; }
  .l { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #3b4256; }
  .go { stroke: #13794a; stroke-width: 2.5; fill: none; } .back { stroke: #0079e6; stroke-width: 2.5; fill: none; }
  .hg { fill: #13794a; } .hb { fill: #0079e6; }
  .warn { fill: #fff4e0; stroke: #f0b45a; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #151a2c; } .zone { fill: #16294a; stroke: #2a4a7a; } .app { fill: #251d45; stroke: #3d3270; }
    .box { fill: #0d1120; stroke: #2a3147; } .h, .b, .m { fill: #eef1f8; } .n { fill: #4aa6ff; } .s, .l { fill: #c3c9d8; }
    .go { stroke: #5fd39a; } .hg { fill: #5fd39a; } .back { stroke: #4aa6ff; } .hb { fill: #4aa6ff; } .warn { fill: #33270f; stroke: #a8772a; }
  }
</style>
<defs>
  <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="hg"/></marker>
  <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="hb"/></marker>
</defs>
<rect x="0" y="0" width="960" height="700" rx="16" class="bg"/>
<rect x="20" y="20" width="330" height="660" rx="16" class="zone"/>
<text x="40" y="50" class="h">THE SHOP'S iVENDNEXT</text>
<rect x="610" y="20" width="330" height="660" rx="16" class="app"/>
<text x="630" y="50" class="h">YOUR APP</text>

<rect x="40" y="72" width="290" height="92" rx="10" class="box"/>
<text x="56" y="96" class="n">1</text><text x="74" y="96" class="b">Consent at install</text>
<text x="56" y="118" class="s">The administrator reads What it will do</text>
<text x="56" y="136" class="s">and ticks. The install adds your roles and</text>
<text x="56" y="154" class="s">makes each till key's own secret.</text>

<rect x="40" y="178" width="290" height="74" rx="10" class="box"/>
<text x="56" y="202" class="n">2</text><text x="74" y="202" class="b">Your app's own user</text>
<text x="56" y="224" class="s">The administrator makes it, with one</text>
<text x="56" y="242" class="s">narrow role, and gives you its key.</text>

<path d="M350,300 H606" class="go" marker-end="url(#g)"/>
<text x="366" y="288" class="n">3</text><text x="384" y="288" class="l">Connect: library key · site · secrets</text>
<text x="366" y="322" class="s">Hosted apps installed from the library.</text>
<text x="366" y="338" class="s">Any other: the secrets reach you by hand.</text>
<rect x="630" y="266" width="290" height="74" rx="10" class="box"/>
<text x="646" y="290" class="b">Checks the key, keeps the shop</text>
<text x="646" y="312" class="s">Signed by iVendNext, for your app,</text>
<text x="646" y="330" class="s">for that site. Then stores its secrets.</text>

<path d="M350,392 H606" class="go" marker-end="url(#g)"/>
<text x="366" y="380" class="n">4</text><text x="384" y="380" class="l">A cashier's press, signed</text>
<text x="366" y="412" class="m">X-iVendNext-Signature</text>
<text x="366" y="427" class="m">X-iVendNext-Timestamp</text>
<text x="366" y="442" class="m">X-iVendNext-Site</text>
<rect x="630" y="358" width="290" height="92" rx="10" class="box"/>
<text x="646" y="382" class="n">5</text><text x="664" y="382" class="b">Checks before it reads</text>
<text x="646" y="404" class="s">HMAC-SHA256 of timestamp.body with that</text>
<text x="646" y="422" class="s">shop's secret, within five minutes.</text>
<text x="646" y="440" class="s">Any other call gets 401.</text>

<path d="M606,486 H354" class="back" marker-end="url(#k)"/>
<text x="366" y="474" class="n">6</text><text x="384" y="474" class="l">The answer, within 3 seconds</text>
<rect x="40" y="462" width="290" height="74" rx="10" class="warn"/>
<text x="56" y="486" class="b">If your app is down or slow</text>
<text x="56" y="508" class="s">The till says nothing was added to the</text>
<text x="56" y="526" class="s">sale, and the sale goes on.</text>

<path d="M606,572 H354" class="back" marker-end="url(#k)"/>
<text x="366" y="560" class="n">7</text><text x="384" y="560" class="l">API calls as your app's own user</text>
<text x="366" y="594" class="m">Authorization: token key:secret</text>

<path d="M350,640 H606" class="go" marker-end="url(#g)"/>
<text x="366" y="628" class="n">8</text><text x="384" y="628" class="l">Uninstall: goodbye</text>
<rect x="630" y="606" width="290" height="56" rx="10" class="box"/>
<text x="646" y="630" class="b">Forgets the shop</text>
<text x="646" y="650" class="s">and the secrets it was given.</text>
</svg>
