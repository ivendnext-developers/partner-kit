<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Plus Jakarta Sans"; font-weight: 800; src: url("{{assets}}/fonts/plus-jakarta-sans-800.woff2") format("woff2"); }
@font-face { font-family: "Plus Jakarta Sans"; font-weight: 600; src: url("{{assets}}/fonts/plus-jakarta-sans-600.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #0e2a47; color: #ffffff; font-family: "Plus Jakarta Sans", Arial, sans-serif; position: relative; }
.bar { position: absolute; inset: 0 auto 0 0; width: 24px; background: #2490ef; }
.logo { position: absolute; left: 88px; top: 72px; width: 220px; height: auto; }
.eyebrow { position: absolute; left: 88px; top: 190px; font-weight: 600; font-size: 34px; letter-spacing: .04em; text-transform: uppercase; color: #6ab0f3; }
h1 { position: absolute; left: 88px; top: 246px; width: 1000px; font-weight: 800; font-size: 66px; line-height: 1.14; }
.host { position: absolute; left: 88px; bottom: 64px; font-weight: 600; font-size: 30px; color: #b9d4ee; }
</style></head>
<body><div class="bar"></div>
<img class="logo" src="{{assets}}/logo-on-dark.svg" alt="">
<p class="eyebrow">{{eyebrow}}</p>
<h1>{{headline}}</h1>
<p class="host">developer.ivendnext.com</p>
</body></html>
