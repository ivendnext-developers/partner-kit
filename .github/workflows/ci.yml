# The kit's checks, on every pull request and every push to main. Nothing here uses a secret, and every job runs on a
# GitHub-hosted runner. A change to the repository settings makes runs started by an outside contributor wait for a code
# owner's approval (CONTRIBUTING.md). Later changes add tests without editing this file: the test runner finds every
# `samples/<name>/tests` and `tools/<name>/tests` folder by itself.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests, API description, contracts, design kit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: The template engine S4's and S29's template tests render with (they skip themselves without it)
        run: python3 -m pip install --quiet jinja2==3.1.6
      - name: Every sample's and tool's tests (found by pattern; the contracts' checks are among them)
        env:
          S29_REQUIRE_JINJA: "1"   # S29's template tests fail, not skip, when the engine above is missing
          S4_REQUIRE_JINJA: "1"    # and S4's
        run: python3 .github/scripts/run_tests.py
      - name: The issue forms match their Markdown forms
        run: python3 .github/scripts/issue_forms.py --check
      - name: Every extension point has a card in the needs catalogue (chapter 16's list is built from the cards)
        run: python3 .github/scripts/chapter16_rows.py
      - name: The API description validates, and the validator is shown able to fail
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet openapi-spec-validator==0.7.1 pyyaml
          bash api/validate.sh
      - name: The design kit's exit check, and proof its page checks can fail
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          test -x "$CHROME"
          bash kit/design/tools/check_kit.sh
          bash kit/design/tools/check_kit.sh samples/s56_guest_ordering/service/page.html samples/s59_kitchen_screen/service/page.html   # their own stylesheets too
          bash kit/design/tools/test_page_checks.sh

  ivn-windows:
    name: ivn on Windows (new, check, push, the installer, doctor)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: The commands a Windows developer types, through ivn.cmd, against the test doors
        run: python tools/ivn/tests/windows_smoke.py
      - name: The one-line installer (irm … | iex) into a temporary profile, twice, then ivn doctor through its launcher
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'profile'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $env:IVN_KIT_REPO = 'file:///' + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          $env:IVN_HOSTING_URL = 'http://127.0.0.1:9'
          Get-Content site/install.ps1 -Raw | Invoke-Expression
          Get-Content site/install.ps1 -Raw | Invoke-Expression
          $launcher = Join-Path $env:USERPROFILE '.ivendnext\bin\ivn.cmd'
          if (-not (Test-Path $launcher)) { throw 'the installer wrote no launcher' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath.Split(';') | Where-Object { $_ -eq (Split-Path $launcher) }).Count -ne 1) { throw "the user Path holds the folder other than once: $userPath" }
          $out = (& $launcher doctor) -join "`n"
          Write-Host $out
          foreach ($want in @("py, the Windows launcher the kit's own ivn.cmd runs: found", 'Not signed in yet.', 'Next: ivn login')) {
            if (-not $out.Contains($want)) { throw "ivn doctor did not say: $want" }
          }
      - name: The installer in Windows PowerShell 5.1 with no git (GitHub's archive, served here), twice, then ivn doctor
        shell: powershell
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'profile51'
          $www = Join-Path $env:RUNNER_TEMP 'www'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE, $www | Out-Null
          git archive --format=zip --prefix=partner-kit-main/ -o (Join-Path $www 'main.zip') HEAD
          Copy-Item site/install.ps1 (Join-Path $www 'install.ps1')
          $head = (git rev-parse HEAD).Trim()
          # every file answered as application/octet-stream, the plainest type a web host may give a .ps1
          $serve = Join-Path $env:RUNNER_TEMP 'serve.py'
          Set-Content -Path $serve -Encoding ASCII -Value "import functools, http.server`nclass H(http.server.SimpleHTTPRequestHandler):`n    def guess_type(self, path): return 'application/octet-stream'`nhttp.server.ThreadingHTTPServer(('127.0.0.1', 8765), functools.partial(H, directory=r'$www')).serve_forever()"
          $srv = Start-Process py -ArgumentList $serve -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:IVN_KIT_ARCHIVE = 'http://127.0.0.1:8765/main.zip'
          $env:IVN_HOSTING_URL = 'http://127.0.0.1:9'
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          if (Get-Command git -ErrorAction SilentlyContinue) { throw 'git is still on the Path' }
          irm http://127.0.0.1:8765/install.ps1 | iex
          New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE '.ivendnext\kit\.vscode') | Out-Null
          Set-Content -Path (Join-Path $env:USERPROFILE '.ivendnext\kit\.vscode\settings.json') -Value '{}'
          irm http://127.0.0.1:8765/install.ps1 | iex
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.ivendnext\kit\.vscode\settings.json'))) { throw 'the update removed a file of the developer' }
          $kit = Join-Path $env:USERPROFILE '.ivendnext\kit'
          if (Test-Path (Join-Path $kit '.git')) { throw 'a git clone, with no git on the Path' }
          if (-not (Get-Content (Join-Path $kit '.kit-commit')).StartsWith($head)) { throw 'the kit is not the archive of this commit' }
          $out = (& (Join-Path $env:USERPROFILE '.ivendnext\bin\ivn.cmd') doctor) -join "`n"
          Write-Host $out
          foreach ($want in @('git: not found', "GitHub's archive", 'Next: ivn login')) {
            if (-not $out.Contains($want)) { throw "ivn doctor did not say: $want" }
          }
          Stop-Process -Id $srv.Id

  ivn-oldest-python:
    name: ivn on Python 3.9, the oldest it runs on (a Mac's own python3)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.9"
      - name: ivn's tests, the installer's and the blank app's, on Python 3.9
        run: |
          python -m unittest discover -s tools/ivn/tests
          python -m unittest discover -s tools/manifest/tests -p test_blank.py

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version, checksum checked)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: The files of this change
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: The commits of this change (a secret added and then removed is still a secret)
        if: github.event_name == 'pull_request'
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts "origin/${{ github.base_ref }}..HEAD"

  dco:
    name: Sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by line
        run: python3 .github/scripts/dco_check.py "origin/${{ github.base_ref }}" HEAD
