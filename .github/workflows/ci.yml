# The kit's checks, on every pull request and every push to main. Nothing here uses a secret, and every job runs on a
# GitHub-hosted runner. A change to the repository settings makes runs started by an outside contributor wait for a code
# owner's approval (CONTRIBUTING.md). Later changes add tests without editing this file: the test runner finds every
# `samples/<name>/tests` and `tools/<name>/tests` folder by itself.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests, API description, contracts, design kit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: The template engine S4's and S29's template tests render with (they skip themselves without it)
        run: python3 -m pip install --quiet jinja2==3.1.6
      - name: Every sample's and tool's tests (found by pattern; the contracts' checks are among them)
        env:
          S29_REQUIRE_JINJA: "1"   # S29's template tests fail, not skip, when the engine above is missing
          S4_REQUIRE_JINJA: "1"    # and S4's
        run: python3 .github/scripts/run_tests.py
      - name: The issue forms match their Markdown forms
        run: python3 .github/scripts/issue_forms.py --check
      - name: Every extension point has a card in the needs catalogue (chapter 16's list is built from the cards)
        run: python3 .github/scripts/chapter16_rows.py
      - name: The API description validates, and the validator is shown able to fail
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet openapi-spec-validator==0.7.1 pyyaml
          bash api/validate.sh
      - name: The design kit's exit check, and proof its page checks can fail
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          test -x "$CHROME"
          bash kit/design/tools/check_kit.sh
          bash kit/design/tools/test_page_checks.sh

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version, checksum checked)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: The files of this change
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: The commits of this change (a secret added and then removed is still a secret)
        if: github.event_name == 'pull_request'
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts "origin/${{ github.base_ref }}..HEAD"

  dco:
    name: Sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by line
        run: python3 .github/scripts/dco_check.py "origin/${{ github.base_ref }}" HEAD
