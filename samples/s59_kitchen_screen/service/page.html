<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Kitchen screen</title>
<link rel="stylesheet" href="ivn-kit.css">
<link rel="stylesheet" href="wall.css">
<link rel="stylesheet" href="page.css">
</head>
<body class="ivn ivn-wall ksc" data-size="standard">
<header class="ivn-wall-head">
  <h1 id="title" class="ivn-wall-title"></h1>
  <p id="stations" class="ivn-wall-sub"></p>
  <div class="ivn-wall-tools">
    <button id="prev" type="button" class="ivn-btn ivn-wall-tool ivn-wall-dir" hidden></button>
    <p id="more" class="ivn-wall-more" hidden></p>
    <button id="next" type="button" class="ivn-btn ivn-wall-tool ivn-wall-dir" hidden></button>
    <button id="recall" type="button" class="ivn-btn ivn-wall-tool" aria-pressed="false" hidden></button>
    <button id="sold" type="button" class="ivn-btn ivn-wall-tool" hidden></button>
    <button id="smaller" type="button" class="ivn-btn ivn-wall-tool" dir="ltr">A-</button>
    <button id="bigger" type="button" class="ivn-btn ivn-wall-tool" dir="ltr">A+</button>
    <p id="read" class="ivn-wall-read"></p>
  </div>
</header>
<section id="waiting" class="ivn-wall-strip" hidden></section>
<p id="note" class="ivn-banner ivn-wall-note" role="alert" hidden></p>
<main id="board" class="ivn-wall-board ksc-board"></main>
<dialog id="sold-dialog" class="ivn-dialog ksc-dialog">
  <div class="ivn-dialog-head"><h2 id="sold-title" class="ivn-dialog-title"></h2></div>
  <div class="ivn-dialog-body"><input id="sold-find" class="ivn-input ksc-find" type="search" autocomplete="off" maxlength="60">
    <ul id="sold-list" class="ivn-list ksc-sold-list"></ul></div>
  <div class="ivn-dialog-foot"><button id="sold-close" type="button" class="ivn-btn" data-ivn-close="close" autofocus></button></div>
</dialog>
<dialog id="ticket-dialog" class="ivn-dialog ksc-dialog">
  <div class="ivn-dialog-head"><h2 id="ticket-title" class="ivn-dialog-title"></h2></div>
  <div id="ticket-body" class="ivn-dialog-body"></div>
  <div class="ivn-dialog-foot"><button id="ticket-close" type="button" class="ivn-btn" data-ivn-close="close"></button></div>
</dialog>
<script src="ivn-kit.js"></script>
<script src="fit.js"></script>
<script src="page.js"></script>
</body>
</html>
